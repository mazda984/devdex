<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Devdex</title>

  <!-- Import map placeholder (use esm.sh libs if you add modules) -->
  <script type="importmap">
  {
    "imports": {}
  }
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Devdex</div>
      <div class="searchwrap">
        <input id="search" type="search" placeholder="Ara oyun, geliştirici..." />
        <button id="filterBtn" aria-label="Filtre">☰</button>
      </div>
      <div class="actions">
        <button id="createBtn">Oluştur</button>
        <button id="loginBtn" class="accent">Giriş</button>
      </div>
    </header>

    <main class="content">
      <aside class="sidebar" id="sidebar">
        <nav>
          <button class="side-item active" data-view="discover">Keşfet</button>
          <button class="side-item" data-view="friends">Arkadaşlar</button>
          <button class="side-item" data-view="messages">Mesajlar</button>
          <button class="side-item" data-view="library">Kütüphane</button>
          <button class="side-item" data-view="develop">Geliştir</button>
        </nav>

        <div class="account">
          <div class="avatar" id="avatar">D</div>
          <div class="acct-info">
            <div class="name">Misafir</div>
            <div class="userid">ID: —</div>
          </div>
        </div>
      </aside>

      <section class="main" id="main">
        <div class="hero">
          <div class="hero-left">
            <h1 id="heroTitle">Öne Çıkan Oyunlar</h1>
            <p id="heroSubtitle">Popüler, yeni ve seni ilgilendirebilecek oyunlar</p>
          </div>
          <div class="hero-right">
            <button id="viewAll">Hepsini Gör</button>
          </div>
        </div>

        <div class="grid" id="grid" role="list"></div>

        <div class="bottombar">
          <div class="status">Çevrimiçi oyuncu: <span id="onlineCount">—</span></div>
          <div class="pagecontrols">
            <button id="prev">‹</button>
            <span id="page">1</span>
            <button id="next">›</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Simple modal for details -->
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose">✕</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <!-- Login full-screen overlay -->
  <div id="loginScreen" class="login-screen" aria-hidden="true">
    <div class="login-card" role="dialog" aria-modal="true">
      <button class="login-close" id="loginClose">✕</button>
      <h2>Giriş Yap</h2>

      <div id="loginChoice" style="display:flex;gap:8px;justify-content:center;margin-bottom:10px">
        <button id="chooseLogin" style="padding:8px 12px;border-radius:8px;border:1px solid #e6e7ea;background:var(--panel)">Giriş Yap</button>
        <button id="chooseRegister" style="padding:8px 12px;border-radius:8px;border:1px solid #e6e7ea;background:transparent">Kayıt Ol</button>
      </div>

      <div id="loginFields" style="display:none">
        <form id="loginForm" autocomplete="off">
          <label class="field">
            <div class="field-label">Profil Fotoğrafı</div>
            <div class="photo-wrap">
              <img id="photoPreview" alt="profil" src="" />
              <input id="photoInput" type="file" accept="image/*" />
            </div>
          </label>

          <label class="field">
            <div class="field-label">Kullanıcı adı</div>
            <input id="loginUsername" type="text" required placeholder="Kullanıcı adınız" />
          </label>

          <label class="field">
            <div class="field-label">Şifre</div>
            <input id="loginPassword" type="password" required placeholder="Şifre" />
          </label>

          <div style="display:flex;gap:8px;margin-top:12px">
            <button type="submit" class="play">Giriş</button>
            <button type="button" id="loginCancel" style="padding:8px;border-radius:8px;border:1px solid #e6e7ea;background:var(--panel)">İptal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
